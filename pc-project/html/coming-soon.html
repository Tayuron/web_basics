<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Незабаром | МАГАЗИК</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			body,
			html {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				background-color: #000000;
				display: flex;
				justify-content: center;
				align-items: center;
				overflow: hidden;
				font-family: 'Montserrat', sans-serif;
			}

			.container {
				text-align: center;
				color: #ffffff;
			}

			h1 {
				font-size: 4rem;
				font-weight: 700;
				margin: 0;
				letter-spacing: 10px;
				text-transform: uppercase;
				animation: fadeIn 2s ease-in-out;
			}

			p {
				font-size: 1.2rem;
				font-weight: 200;
				margin-top: 1rem;
				color: #888;
				letter-spacing: 3px;
				text-transform: uppercase;
				animation: fadeIn 3s ease-in-out;
			}

			.back-link {
				display: inline-block;
				margin-top: 3rem;
				color: #ffffff;
				text-decoration: none;
				border: 1px solid #ffffff;
				padding: 10px 25px;
				font-size: 0.8rem;
				transition: all 0.3s ease;
				animation: fadeIn 4s ease-in-out;
			}

			.back-link:hover {
				background-color: #ffffff;
				color: #000000;
			}

			@keyframes fadeIn {
				from {
					opacity: 0;
					transform: translateY(200px);
				}
				to {
					opacity: 1;
					transform: translateY(0);
				}
			}

			@media (max-width: 600px) {
				h1 {
					font-size: 2.5rem;
					letter-spacing: 5px;
				}
				p {
					font-size: 0.9rem;
				}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>COMING SOON</h1>
			<p>Ми працюємо над чимось крутим</p>
			<a href="index.html" class="back-link">ПОВЕРНУТИСЯ НА ГОЛОВНУ</a>
		</div>
	</body>
</html>
