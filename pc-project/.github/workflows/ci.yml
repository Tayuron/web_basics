name: Quality checks

on:
  push:
    branches: [main, lab3]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: pc-project/vite-project

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc-project/vite-project/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
